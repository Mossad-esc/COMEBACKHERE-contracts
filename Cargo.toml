[workspace]
members = ["contracts/invoice", "contracts/treasury", "contracts/compliance", "tests", "crates/compliance-client"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/dreamgeneX/COMEBACKHERE"

[workspace.dependencies]
soroban-sdk = { version = "20.0.0" }
stellar-xdr = "0.0.18"
derive_arbitrary = "=1.3.2"

# Soroban contracts ship as WASM and CI caps every contract at 64 KiB
# (.github/workflows/contract-size.yml). Optimise and strip release builds so
# the contracts keep headroom as entrypoints are added.
[profile.release]
opt-level = "z"
strip = true
